name: Deploy Off-Brand to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read
  deploy:
    needs: checks
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage static site + data
        run: |
          mkdir -p _site/data
          cp -r site/* _site/
          cp data/reviews.json _site/data/reviews.json
          # cache-bust app.js / styles.css so phones don't keep stale copies
          sed -i "s/__BUILD__/${GITHUB_SHA::7}/g" _site/index.html _site/methodology.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - id: deployment
        uses: actions/deploy-pages@v4
