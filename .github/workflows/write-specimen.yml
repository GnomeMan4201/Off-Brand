name: Write This Specimen

# Opens (or reopens) the draft issue for one specimen in the PRIVATE shelf repo.
# Running it twice for the same id returns the same draft.
# Needs: variable SHELF_REPO and secret SHELF_TOKEN (contents + issues on the shelf repo only).
on:
  workflow_dispatch:
    inputs:
      specimen_id:
        description: "Specimen id, e.g. urlscan-<uuid> (shown on the specimen page)"
        required: true
      replace_legacy:
        description: "Optional mapped legacy issue number; create a new authenticated private draft"
        required: false
        default: ""
      dry_run:
        description: "Dry run: report what would happen, create nothing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: write-specimen
  cancel-in-progress: false

jobs:
  write:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    env:
      SHELF_REPO: ${{ vars.SHELF_REPO }}
      GH_TOKEN: ${{ secrets.SHELF_TOKEN }}
      OFFBRAND_SHELF_DIR: ${{ github.workspace }}/shelf
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refuse unless the shelf repo is private
        run: python3 scripts/shelf.py check-private

      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SHELF_REPO }}
          token: ${{ secrets.SHELF_TOKEN }}
          path: shelf

      - run: pip install pillow==13.0.0

      - name: Open or find the draft issue
        env:
          OFFBRAND_PROVENANCE_KEY: ${{ secrets.OFFBRAND_PROVENANCE_KEY }}
          SPECIMEN_ID: ${{ inputs.specimen_id }}
          DRY_RUN: ${{ inputs.dry_run }}
          REPLACE_LEGACY: ${{ inputs.replace_legacy }}
          URLSCAN_API_KEY: ${{ secrets.URLSCAN_API_KEY }}
        run: |
          set -o pipefail
          ARGS=(--id "$SPECIMEN_ID")
          [ "$DRY_RUN" = "true" ] && ARGS+=(--dry-run)
          [ -z "$REPLACE_LEGACY" ] || ARGS+=(--replace-legacy "$REPLACE_LEGACY")
          python3 scripts/write_specimen.py "${ARGS[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Record the draft link in the shelf
        if: ${{ !inputs.dry_run }}
        run: |
          cd shelf
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: link specimen to its draft issue"
          git pull --rebase origin HEAD
          git push
