name: Write This Specimen

# Opens (or reopens) the editorial triage issue for one archived specimen.
# Safe to run twice for the same id: the existing issue is reused.
on:
  workflow_dispatch:
    inputs:
      specimen_id:
        description: "Specimen id, e.g. urlscan-<uuid> (shown on the specimen page)"
        required: true
      dry_run:
        description: "Dry run: report what would happen, create nothing"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: write-specimen
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Open or find the draft issue
        env:
          GH_TOKEN: ${{ github.token }}
          SPECIMEN_ID: ${{ inputs.specimen_id }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=(--id "$SPECIMEN_ID")
          [ "$DRY_RUN" = "true" ] && ARGS+=(--dry-run)
          python3 scripts/write_specimen.py "${ARGS[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Record the draft link
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/archive_drafts.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: link specimen to its draft issue"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
          gh workflow run deploy.yml --ref "$GITHUB_REF_NAME"
