name: Publish Approved Review

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

jobs:
  publish:
    if: >-
      github.event.label.name == 'approved' &&
      github.event.sender.login == github.repository_owner &&
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'triage')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract latest comment & publish
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          REVIEW_COMMENT=$(python scripts/approved_comment.py)
          export REVIEW_COMMENT
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B main origin/main
            python scripts/publish_from_issue.py
            git add data/reviews.json
            git diff --cached --quiet || git commit -m "Publish review from issue #$ISSUE_NUMBER"
            if git push origin HEAD:main; then
              gh issue close "$ISSUE_NUMBER" --reason completed --comment "Review committed."
              exit 0
            fi
          done
          exit 1

  deploy:
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
