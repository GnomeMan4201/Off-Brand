name: Publish Approved Review

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Public triage issue number"
        required: true
      comment_id:
        description: "Numeric ID from the approved review comment link"
        required: true

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: editorial-publication
  cancel-in-progress: false

jobs:
  publish:
    if: vars.URLSCAN_PUBLIC_REUSE_AUTHORIZED == 'true' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    env:
      ISSUE: ${{ inputs.issue_number }}
      COMMENT_ID: ${{ inputs.comment_id }}
      EDITOR_LOGIN: ${{ github.repository_owner }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish explicitly selected review
        env:
          OFFBRAND_PROVENANCE_KEY: ${{ secrets.OFFBRAND_PROVENANCE_KEY }}
        run: python3 scripts/publish_approved.py --repo "$GITHUB_REPOSITORY" --issue "$ISSUE" --comment "$COMMENT_ID"
      - name: Commit review, close issue, deploy through checks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/reviews.json
          git diff --cached --quiet || git commit -m "feat: publish approved review"
          git push
          gh issue close "$ISSUE" --reason completed --comment "Published to Off-Brand."
          gh workflow run deploy.yml --ref main
