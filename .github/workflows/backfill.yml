name: Backfill Candidates (manual)

# One-off manual run: up to 30 candidates from the last N days.
# Doesn't use the daily cap. Run the draft benchmark first to check timing.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max candidates (30 at most)"
        default: "30"
      days:
        description: "How many days back to search"
        default: "7"

permissions:
  contents: write
  issues: write

concurrency:
  group: intake
  cancel-in-progress: false

env:
  OFFBRAND_MODEL: qwen2.5:7b

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run backfill ingestion (no target contact)
        id: ingest
        env:
          URLSCAN_API_KEY: ${{ secrets.URLSCAN_API_KEY }}
          LIMIT: ${{ inputs.limit }}
          DAYS: ${{ inputs.days }}
        run: |
          python3 scripts/ingest.py --mode backfill --limit "$LIMIT" --days "$DAYS"
          echo "count=$(python3 -c 'import json;print(len(json.load(open("data/pending_candidates.json"))))')" >> "$GITHUB_OUTPUT"

      - name: Set up local model
        if: steps.ingest.outputs.count != '0'
        uses: ./.github/actions/setup-ollama
        with:
          model: ${{ env.OFFBRAND_MODEL }}

      - name: Open triage issues and post drafts
        if: steps.ingest.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/open_issues.py

      - name: Commit seen IDs and intake log
        if: always() && steps.ingest.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen.json data/intake_log.json
          git diff --cached --quiet || git commit -m "chore: backfill intake"
          git pull --rebase origin main
          git push
