name: Backfill Triage Queue (manual)

# One-off manual run: stages up to 30 distinct, screenshot-backed candidates
# from the past N days. Skips anything already seen, published, or with an issue.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max candidates (30 at most)"
        default: "30"
      days:
        description: "How many days back to search"
        default: "7"
      dry_run:
        description: "Dry run: list what would be opened, create nothing"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency:
  group: intake
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stage backfill candidates (no target contact)
        env:
          URLSCAN_API_KEY: ${{ secrets.URLSCAN_API_KEY }}
          LIMIT: ${{ inputs.limit }}
          DAYS: ${{ inputs.days }}
        run: python3 scripts/ingest.py --mode backfill --limit "$LIMIT" --days "$DAYS"

      - name: Open triage issues
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          cd scripts
          if [ "$DRY_RUN" = "true" ]; then
            python3 backfill_issues.py --dry-run
          else
            python3 backfill_issues.py
          fi

      - name: Commit updated seen.json
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen.json
          git diff --cached --quiet || git commit -m "chore: backfill seen candidate IDs"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
