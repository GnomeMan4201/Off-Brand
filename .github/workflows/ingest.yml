name: Fetch Phishing Candidates for Phone Triage

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run ingestion (no target contact)
        env:
          URLSCAN_API_KEY: ${{ secrets.URLSCAN_API_KEY }}
        run: python3 scripts/ingest.py

      - name: Open GitHub Issues for human review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - << 'EOF'
          import json, subprocess
          from pathlib import Path

          p = Path("data/pending_candidates.json")
          if not p.exists():
              raise SystemExit(0)
          candidates = json.loads(p.read_text(encoding="utf-8"))
          for c in candidates:
              body = "\n".join([
                  f"id: {c['id']}",
                  f"source: {c['source']}",
                  f"public_record_url: {c['public_record_url']}",
                  f"defanged_url: {c['defanged_url']}",
                  f"defanged_domain: {c.get('defanged_domain') or ''}",
                  f"ip: {c.get('ip') or ''}",
                  f"asn_name: {c.get('asn_name') or ''}",
                  f"page_title: {c.get('page_title') or ''}",
                  f"scanned_at: {c.get('scanned_at') or ''}",
                  "",
                  "### Auto-detected tells",
                  *[f"- {t}" for t in c.get("auto_tells", [])],
                  "",
                  "### How to publish from your phone",
                  "Reply with a comment using these `key: value` lines, then add the `approved` label:",
                  "```",
                  "brand: <Target Brand>",
                  "aisle: <Banking | Crypto & Wallets | Marketplace & Retail | Cloud & SaaS>",
                  "knockoff_label: <Funny product name>",
                  "verdict: <e.g. Dollar-Store Knockoff>",
                  "rating: <e.g. 2/10>",
                  "tells: <Tell 1> | <Tell 2>",
                  "critic_note: <1-3 sentences in Off-Brand voice>",
                  "```",
              ])
              title = f"[Triage] {c.get('defanged_domain') or c['id']}"
              subprocess.run(
                  ["gh", "issue", "create", "--title", title, "--body", body, "--label", "triage"],
                  check=True,
              )
          EOF

      - name: Commit updated seen.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen.json
          git diff --cached --quiet || git commit -m "chore: update seen candidate IDs"
          git push
