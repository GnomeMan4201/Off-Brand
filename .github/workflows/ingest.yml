name: Fetch Phishing Candidates for Phone Triage

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  ingest:
    if: vars.URLSCAN_PUBLIC_REUSE_AUTHORIZED == 'true' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run ingestion (no target contact)
        env:
          URLSCAN_API_KEY: ${{ secrets.URLSCAN_API_KEY }}
          # Optional: only pre-2020 PhishTank accounts have keys; without one the public
          # dump is used and allows a few downloads per day.
          PHISHTANK_APP_KEY: ${{ secrets.PHISHTANK_APP_KEY }}
        run: python3 scripts/ingest.py

      - name: Open GitHub Issues for human review
        env:
          GH_TOKEN: ${{ github.token }}
          OFFBRAND_PROVENANCE_KEY: ${{ secrets.OFFBRAND_PROVENANCE_KEY }}
        run: |
          python3 - << 'EOF'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from voices import assign_batch, assignment_markdown
          from evidence import issue_lines
          from provenance import create_attested_issue, signing_key

          signing_key()  # fail before creating any issues if no key

          p = Path("data/pending_candidates.json")
          if not p.exists():
              raise SystemExit(0)
          candidates = json.loads(p.read_text(encoding="utf-8"))
          published = json.loads(Path("data/reviews.json").read_text(encoding="utf-8")).get("items", [])
          assignments = assign_batch(published, [c["id"] for c in candidates])
          for c in candidates:
              a = assignments[c["id"]]
              body = "\n".join([
                  f"id: {c['id']}",
                  f"source: {c['source']}",
                  f"public_record_url: {c['public_record_url']}",
                  f"defanged_url: {c['defanged_url']}",
                  f"defanged_domain: {c.get('defanged_domain') or ''}",
                  f"ip: {c.get('ip') or ''}",
                  f"asn_name: {c.get('asn_name') or ''}",
                  f"page_title: {c.get('page_title') or ''}",
                  f"scanned_at: {c.get('scanned_at') or ''}",
                  "",
                  "### Auto-detected tells",
                  *[f"- {t}" for t in c.get("auto_tells", [])],
                  "",
                  *(issue_lines(c["evidence"], private=False) if c.get("evidence") else ["### Evidence level: not assessed"]),
                  "",
                  *assignment_markdown(a),
                  "",
                  "### How to publish from your phone",
                  "Reply with a comment using these `key: value` lines, then add the `approved` label. Copy the comment link and use its numeric comment ID with the publication workflow:",
                  "```",
                  "brand: <Target Brand>",
                  "aisle: <Banking | Crypto & Wallets | Marketplace & Retail | Cloud & SaaS>",
                  "knockoff_label: <Funny product name>",
                  "verdict: <e.g. Dollar-Store Knockoff>",
                  "rating: <e.g. 2/10>",
                  "sketchy_segment: <the exact part of the URL that gives it away>",
                  "tells: <Tell 1> | <Tell 2>",
                  "critic_note: <1-3 sentences in the assigned voice>",
                  f"voice: {a['voice']}",
                  f"edge: {a['edge']}",
                  "```",
              ])
              title = f"[Triage] {c.get('defanged_domain') or c['id']}"
              create_attested_issue(os.environ["GITHUB_REPOSITORY"], title, body)
          EOF

      - name: Commit updated seen.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen.json
          git diff --cached --quiet || git commit -m "chore: update seen candidate IDs"
          git push
