name: Fetch Phishing Candidates for Phone Triage
on:
  schedule:
    - cron: "17 2,14 * * *"
  push:
    branches: [main]
    paths: [".github/workflows/ingest.yml"]
  workflow_dispatch:
    inputs:
      mode:
        description: Intake allowance
        type: choice
        options: [regular, backfill]
        default: regular
permissions:
  contents: read
  issues: write
concurrency:
  group: off-brand-intake
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU inference runtime
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.51.3 accelerate==1.6.0
      - name: Stage candidates and post review drafts
        env:
          GH_TOKEN: ${{ github.token }}
          URLSCAN_API_KEY: ${{ secrets.URLSCAN_API_KEY }}
          INTAKE_MODE: ${{ github.event_name == 'push' && 'backfill' || inputs.mode || 'regular' }}
        run: python scripts/queue_reviews.py
