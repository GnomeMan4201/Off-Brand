name: Publish Approved Specimen

# The explicit approval step for shelf drafts. Write your review as a comment on the
# draft issue (in the private shelf repo), add the approved label, then select its comment ID.
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Draft issue number in the shelf repo"
        required: true
      comment_id:
        description: "Numeric ID from the approved review comment link"
        required: true

permissions:
  contents: write
  actions: write

concurrency:
  group: editorial-publication
  cancel-in-progress: false

jobs:
  publish:
    if: vars.URLSCAN_PUBLIC_REUSE_AUTHORIZED == 'true' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    env:
      SHELF_REPO: ${{ vars.SHELF_REPO }}
      OFFBRAND_SHELF_DIR: ${{ github.workspace }}/shelf
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refuse unless the shelf repo is private
        env:
          GH_TOKEN: ${{ secrets.SHELF_TOKEN }}
        run: python3 scripts/shelf.py check-private

      - name: Publish the approved draft
        env:
          OFFBRAND_PROVENANCE_KEY: ${{ secrets.OFFBRAND_PROVENANCE_KEY }}
          GH_TOKEN: ${{ secrets.SHELF_TOKEN }}
          ISSUE: ${{ inputs.issue_number }}
          COMMENT_ID: ${{ inputs.comment_id }}
          EDITOR_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/publish_approved.py --repo "$SHELF_REPO" --private --issue "$ISSUE" --comment "$COMMENT_ID"

      - name: Commit review, close the draft, redeploy
        env:
          GH_TOKEN: ${{ secrets.SHELF_TOKEN }}
          PUBLIC_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue_number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/reviews.json
          git diff --cached --quiet || git commit -m "feat: publish review from shelf draft #$ISSUE"
          git push
          gh issue close "$ISSUE" -R "$SHELF_REPO" --reason completed --comment "Published to Off-Brand."
          GH_TOKEN="$PUBLIC_TOKEN" gh workflow run deploy.yml --ref "$GITHUB_REF_NAME"
