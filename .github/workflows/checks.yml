name: Regression checks
on:
  pull_request:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check
          python --version
          python -m pip freeze
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          command -v google-chrome
          google-chrome --version
          node --version
          ffprobe -version
          echo "OFFBRAND_CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Require full regression suite
        run: |
          python -m pytest -q tests --junitxml=results.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("results.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
          if not suites or sum(int(s.get("tests", 0)) for s in suites) == 0:
              raise SystemExit("No tests executed")
          if root.findall(".//skipped"):
              raise SystemExit("A required test was skipped")
          PY
      - name: Preserve regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-results
          path: results.xml
          if-no-files-found: warn
          retention-days: 30
